[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dinesafe-toronto"
version = "1.0.0"
description = "Download, clean and model Toronto Public Health DineSafe inspections, with a map dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebooks = ["ipykernel", "matplotlib", "seaborn"]

[project.scripts]
dinesafe = "dinesafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
